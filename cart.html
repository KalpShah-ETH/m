<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1E4D3A;
    --forest-dark:#142F23;
    --forest-tint:#DCE8E1;
    --terracotta:#B85042;
    --gold:#D9A441;
    --page-bg:#F6F8FA;
    --border:#E4E9EE;
    --text:#16232F;
    --text2:#5B6B7C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background:#ccc;
    display:flex;
    justify-content:center;
    padding:20px 0;
  }
  .phone{
    width:360px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
    display:flex;
    flex-direction:column;
  }

  /* Status bar */
  .status-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 16px 4px 16px;
    font-size:13px;
    font-weight:600;
    color:#1a1a1a;
  }
  .status-left{ display:flex; align-items:center; gap:6px; }
  .status-right{ display:flex; align-items:center; gap:5px; }
  .vsq{
    width:16px;height:16px;
    background:#3a3a3c;
    border-radius:3px;
    color:#fff;
    font-size:9px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }

  /* Header */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 14px 16px;
  }
  .header-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .back-btn{
    width:30px;height:30px;
    border:1.5px solid var(--border);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#333;
  }
  .header-title{
    font-size:21px;
    font-weight:700;
    color:var(--text);
  }
  .clear-cart{
    color:var(--text2);
    font-size:14.5px;
    font-weight:400;
  }

  /* grey band wrapping select-all + card */
  .grey-band{
    background:var(--page-bg);
    padding:14px 14px 22px 14px;
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .select-all-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 4px 14px 4px;
  }
  .select-all{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:15px;
    font-weight:500;
    color:var(--text);
  }
  .collapse-all{
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--text2);
    font-weight:400;
    font-size:14px;
  }

  .checkbox{
    width:20px;height:20px;
    background:var(--forest);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    flex-shrink:0;
  }

  /* Distributor card */
  .card{
    background:#fff;
    border-radius:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 14px 4px 14px;
  }
  .card-header-left{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:16px;
    font-weight:600;
    color:var(--text);
  }
  .trash-icon{
    width:19px;height:19px;
    color:var(--text2);
  }

  .card-sub{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px 16px 14px;
  }
  .item-count{
    color:var(--text2);
    font-weight:400;
    font-size:14.5px;
    margin-right:10px;
  }
  .add-more-btn{
    border:1.3px solid var(--gold);
    background:#FBF1DF;
    color:#A67527;
    font-weight:500;
    font-size:13.5px;
    border-radius:20px;
    padding:7px 14px;
  }
  .card-total{
    font-size:15px;
    font-weight:600;
    color:var(--text);
  }

  .divider{
    height:1px;
    background:var(--border);
    margin:0 0;
  }

  .remarks-wrap{ padding:14px; }
  .remarks{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 14px;
    color:var(--text2);
    font-weight:400;
    font-size:14.5px;
  }

  .item-row{
    padding:2px 14px 16px 14px;
  }
  .item-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .item-name{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:15px;
    font-weight:500;
    color:var(--text);
  }
  .remove-x{
    width:20px;height:20px;
    color:var(--terracotta);
  }
  .item-prices{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:13.5px;
    font-weight:400;
    color:var(--text2);
    margin-bottom:12px;
  }
  .item-prices b{ font-weight:600; color:var(--text); }
  .stock{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:3px;
    color:var(--forest);
    font-weight:500;
    font-size:14px;
  }
  .item-bottom{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .qty-box{
    background:var(--forest-tint);
    border:1.3px solid var(--forest);
    color:var(--text);
    border-radius:8px;
    padding:9px 22px;
    font-size:14.5px;
    font-weight:400;
  }
  .item-total{
    margin-left:auto;
    font-size:14.5px;
    font-weight:500;
    color:var(--text);
  }

  .spacer{ flex:1; }

  /* Footer */
  .footer-card{
    background:#fff;
    border-radius:14px 14px 0 0;
    margin-top:8px;
  }
  .footer-info{
    padding:14px 16px 12px 16px;
    color:var(--text2);
    font-weight:400;
    font-size:14px;
  }
  .footer-bar{
    display:flex;
    align-items:stretch;
    margin:0 16px 16px 16px;
    border-radius:8px;
    overflow:hidden;
  }
  .total-box{
    background:var(--forest-tint);
    flex:1;
    padding:8px 12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .total-label{
    color:var(--text2);
    font-weight:400;
    font-size:9.5px;
    margin-bottom:2px;
  }
  .total-amount{
    display:flex;
    align-items:center;
    gap:3px;
    font-size:11.5px;
    font-weight:600;
    color:var(--text);
  }
  .rupee-badge{
    width:12px;height:12px;
    background:var(--text);
    color:#fff;
    border-radius:50%;
    font-size:7px;
    display:flex;align-items:center;justify-content:center;
  }
  .place-order-btn{
    background:var(--forest);
    color:#fff;
    font-size:10.5px;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    border:none;
    padding:8px 20px;
    flex:1.3;
  }

  /* Bottom nav */
  .bottom-nav-wrap{ position:relative; }
  .active-indicator{
    position:absolute;
    top:0; right:0;
    width:20%;
    height:2.5px;
    background:var(--forest);
  }
  .bottom-nav{
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    padding:8px 0 10px 0;
    border-top:1px solid #E4E9EE;
    position:relative;
  }
  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:11px;
    color:var(--text2);
    width:64px;
  }
  .nav-item.active{ color:var(--forest); font-weight:600; }
  .nav-icon{ width:22px;height:22px; color:var(--text2); }
  .nav-item.active .nav-icon{ color:var(--forest); }
  .search-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:-26px;
  }
  .search-circle{
    width:48px;height:48px;
    background:var(--forest);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(79,115,220,.4);
    margin-bottom:6px;
  }

  /* android system bar */
  .sys-nav{
    background:#000;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:14px 40px;
  }
  .sys-nav span{ color:#8a8a8a; font-size:16px; }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <div class="status-left">
      <span>11:56</span>
      <span class="vsq">V</span>
    </div>
    <div class="status-right">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 10 L3 14 M7 6 L7 18 M11 3 L11 21 M15 6 L15 18 M19 10 L19 14" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/></svg>
      <span style="font-size:9px;line-height:1;">VoLTE<br/>LTE</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M2 8 Q12 0 22 8 M5 12 Q12 6 19 12 M8 16 Q12 13 16 16 M12 19 L12 20" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 18 L4 14 M9 18 L9 11 M14 18 L14 8 M19 18 L19 5" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/></svg>
      <svg width="20" height="14" viewBox="0 0 28 16" fill="none"><rect x="1" y="1" width="23" height="14" rx="2.5" stroke="#1a1a1a" stroke-width="1.5"/><rect x="25" y="6" width="2" height="4" fill="#1a1a1a"/><rect x="3" y="3" width="17" height="10" fill="#1a1a1a"/></svg>
    </div>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="back-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="header-title">Cart</div>
    </div>
    <div class="clear-cart">Clear Cart</div>
  </div>

  <div class="grey-band">
    <div class="select-all-row">
      <div class="select-all">
        <span class="checkbox"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Select All
      </div>
      <div class="collapse-all">Collapse All
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 15L12 8L19 15" stroke="#B85042" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-header-left">
          <span class="checkbox"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Abhay pharma
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 15L12 8L19 15" stroke="#B85042" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="trash-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M10 3.5 Q10 2.5 11 2.5 L13 2.5 Q14 2.5 14 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7.5 6.5 L8.3 19 Q8.4 20 9.4 20 L14.6 20 Q15.6 20 15.7 19 L16.5 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6.5 6.5 H17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
      </div>

      <div class="card-sub">
        <div style="display:flex;align-items:center;">
          <span class="item-count">1 Item</span>
          <span class="add-more-btn">+ Add more items</span>
        </div>
        <span class="card-total">&#8377;576.27</span>
      </div>

      <div class="divider"></div>

      <div class="remarks-wrap">
        <div class="remarks">Remarks</div>
      </div>

      <div class="item-row">
        <div class="item-top">
          <div class="item-name">
            <span class="checkbox"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            Anablast hair serum(small)
          </div>
          <span class="remove-x">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 9L15 15M15 9L9 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
        </div>

        <div class="item-prices">
          <span>PTR: <b>576.27</b></span>
          <span>MRP: &#8377; <b>850.00</b></span>
          <span class="stock">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M12 3 L20 7.5 V16.5 L12 21 L4 16.5 V7.5 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M4 7.5 L12 12 L20 7.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M12 12 V21" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            2
          </span>
        </div>

        <div class="item-bottom">
          <span class="qty-box">1</span>
          <span class="item-total">&#8377; 576.27</span>
        </div>
      </div>
    </div>

    <div class="spacer"></div>
  </div>

  <div class="footer-card">
    <div class="footer-info">1 item &nbsp;&#8226;&nbsp; 1 Distributor</div>
    <div class="footer-bar">
      <div class="total-box">
        <div class="total-label">Total:</div>
        <div class="total-amount"><span class="rupee-badge">&#8377;</span>576.27</div>
      </div>
      <button class="place-order-btn">Place Order</button>
    </div>

    <div class="bottom-nav-wrap">
      <div class="active-indicator"></div>
      <div class="bottom-nav">
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4L20 11.5V19A1 1 0 0 1 19 20H5A1 1 0 0 1 4 19Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 15H14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Home
        </div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M4 20V8L9 4V20" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 20V6L15 9V20" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 20V9L20 11V20" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Browse
        </div>
        <div class="search-wrap">
          <div class="search-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="#fff" stroke-width="2"/><path d="M20 20L15.5 15.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <span style="font-size:11px;color:#5B6B7C;">Search</span>
        </div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M5 5H15L19 9V19H5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 3H15V6H9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Orders
        </div>
        <div class="nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6H21L19 15H8L6 3H2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17.5" cy="19" r="1.4"/></svg>
          Cart
        </div>
      </div>
    </div>
  </div>

  <div class="sys-nav">
    <span>&#9664;</span>
    <span>&#9711;</span>
    <span>&#9776;</span>
  </div>

</div>

</body>
</html>
